## 清单边界

资料整理包含 109 条记录，其中 47 条为原样复测候选、23 条缺原文件或完整复现、8 条为能力与交互选择、25 条已有同类能力或防护、5 条为不同依赖链或既有范围限制、1 条已有同字节回归。这些是分流数量，不是修复数量。存在跨格式子问题，专项引用数不能直接相加当作独立问题数。

本次未批量关闭问题。没有将“可解析”“图片不报错”“回归通过”等同于整篇文档与桌面应用像素一致。仍缺证据的项目不能以新增合成用例自动关闭。

