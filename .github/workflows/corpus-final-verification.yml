结果与实际运行编号见 [verification.json](evidence/corpus-combined-20260922/verification.json)。五套专项同时在最终功能代码上重跑，构建七个相关包；冻结锁检查仅为 lockfile-only，不是全仓库发版验收。

DOCX 修改通过仓库标准 pnpm 补丁接入五个入口并更新 Worker 缓存标识。必须按仓库的 patchedDependencies 安装；npm 上的旧版本未被替换，也没有发布新包。源码修复、原样中性校验和独立回退说明分别见容器、DOCX 引擎和表格修复记录。
'''
          pathlib.Path('docs/regressions/corpus-progress-20260922.md').write_text(summary)
          PY
          git add -- docs/regressions/evidence/corpus-combined-20260922 docs/regressions/corpus-progress-20260922.md
          git rm -- .github/workflows/corpus-final-verification.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(review): record combined regression evidence and remaining fidelity scope'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
