name: Combined compatibility verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install actual dependencies and declared package patches
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/combined-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const dir of ['core','renderers/doc','renderers/pptx','renderers/word','renderers/pdf','renderers/text','renderers/spreadsheet']){
            const p=JSON.parse(fs.readFileSync(`packages/${dir}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2','billboard.js':'3.18.0','d3-format':'3.1.2',pnpm:'11.0.9'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/combined-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/combined-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          patch --batch --forward -p1 -d node_modules/@file-viewer/docx < "$GITHUB_WORKSPACE/patches/@file-viewer__docx@0.3.32.patch"
          ln -s "$RUNNER_TEMP/combined-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          ln -s "$RUNNER_TEMP/combined-runtime/node_modules" "$GITHUB_WORKSPACE/packages/renderers/pdf/node_modules"
      - name: Frozen lock and seven owning package builds
        run: |
          set -euo pipefail
          node node_modules/pnpm/bin/pnpm.cjs install --lockfile-only --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/combined-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/combined-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/doc run build
          rm -rf "$RUNNER_TEMP/combined-runtime/node_modules/@file-viewer/doc"
          ln -s "$GITHUB_WORKSPACE/packages/renderers/doc" "$RUNNER_TEMP/combined-runtime/node_modules/@file-viewer/doc"
          for package in pptx word pdf text spreadsheet; do npm --prefix "packages/renderers/$package" run build; done
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check
          node packages/renderers/spreadsheet/scripts/verify-github-175.mjs
          node packages/renderers/spreadsheet/scripts/verify-github-234.mjs
      - name: Re-run all five compatibility suites on the combined source
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node scripts/verify-container-compatibility.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          node packages/renderers/spreadsheet/scripts/verify-text-containers.mjs
          node scripts/verify-compatibility-review.mjs
          node scripts/verify-output-compatibility.mjs
      - name: Record verified scope without treating inventory as resolved
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,os,hashlib,shutil
          root=pathlib.Path('docs/regressions/evidence/corpus-combined-20260922');root.mkdir(parents=True,exist_ok=True)
          suites=[('containers','container-compatibility',4),('engine','docx-engine-compatibility',11),('spreadsheet','spreadsheet-text-containers',18),('prior-renderers','compatibility-review',36),('prior-output','output-compatibility',39)]
          checks={}
          for name,directory,count in suites:
            src=pathlib.Path('output')/directory/'report.json';report=json.loads(src.read_text());assert report['passed']==count,name
            if name=='containers':assert report['pictureUnitTests']==6
            shutil.copyfile(src,root/(name+'.json'));checks[name]={'passed':count,'sha256':hashlib.sha256(src.read_bytes()).hexdigest()}
          receipt={'functionalHead':'231873131302dd51d83554b1ccd2b1221313c433','run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'packageBuilds':['core','doc','pptx','word','pdf','text','spreadsheet'],'frozenLock':'lockfile-only validation passed; not a full workspace install/build','suites':checks,'extraPictureUnitTests':6,'fullCorpusFidelityAccepted':False}
          (root/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/corpus-combined-20260922
          git rm -- .github/workflows/corpus-final-verification.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(review): record combined regression evidence and remaining fidelity scope'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
