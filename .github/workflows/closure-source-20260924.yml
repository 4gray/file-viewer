name: Closure source snapshot
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/workflows/closure-source-20260924.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Snapshot tracked review sources
        run: |
          mkdir -p "$RUNNER_TEMP/closure-snapshot"
          python3 - <<'PY'
          import pathlib,os,tarfile,subprocess,json,hashlib
          roots=('packages/core/','packages/renderers/doc/','packages/renderers/word/','packages/renderers/pptx/','packages/renderers/spreadsheet/','scripts/','test/','patches/','docs/regressions/')
          entries=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          manifest={}
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'closure-snapshot/source.tar.gz','w:gz') as t:
            for name in entries:
              p=pathlib.Path(name)
              if name and p.is_file() and (name.startswith(roots) or '/' not in name or p.name=='package.json'):
                t.add(p,arcname=name);manifest[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'closure-snapshot'
          (out/'source-manifest.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'files':manifest},indent=2))
          PY
      - name: Install immutable owning package graph
        run: |
          npm install --prefix "$RUNNER_TEMP/tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/core --filter @file-viewer/renderer-word... --filter @file-viewer/pptx --filter @file-viewer/renderer-spreadsheet... install --frozen-lockfile --ignore-scripts
          cp "$(command -v node)" "$RUNNER_TEMP/closure-snapshot/node"
          tar -czf "$RUNNER_TEMP/closure-snapshot/dependencies.tar.gz" node_modules packages/core/node_modules packages/renderers/doc/node_modules packages/renderers/word/node_modules packages/renderers/pptx/node_modules packages/renderers/spreadsheet/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: closure-source-20260924
          path: ${{ runner.temp }}/closure-snapshot/
          retention-days: 1
          compression-level: 0
