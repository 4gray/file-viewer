name: PPTX chart family verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/pptx-chart-family-review.b64, .github/workflows/pptx-chart-family-review.yml]
permissions:
  contents: write
concurrency:
  group: pptx-chart-family-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded source patch
        run: |
          python3 - <<'PY'
          import pathlib,lzma,base64,hashlib,subprocess
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          data=decoder.decompress(base64.b64decode(pathlib.Path('.github/pptx-chart-family-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(data).hexdigest()=='46cad9cf8d1b135d0bcbb19f61c0014682b103567229366e81b3af60c2fde8bf'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','--index','-'],input=data,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==6 and all(p.startswith(('packages/renderers/pptx/','docs/regressions/')) for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Frozen workspace install and browser setup
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/chart-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/chart-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/core --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json packages/renderers/pptx/package.json
          npm --prefix packages/core run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify old implementation fails targeted chart assertions
        run: |
          set -euo pipefail
          paths='packages/renderers/pptx/src/chart.ts packages/renderers/pptx/src/engine/support/vendor.js packages/renderers/pptx/src/engine/support/chart-data.js'
          for path in $paths; do git show "HEAD:$path" > "$path"; done
          trap 'git checkout-index -f -- packages/renderers/pptx/src/chart.ts packages/renderers/pptx/src/engine/support/vendor.js packages/renderers/pptx/src/engine/support/chart-data.js' EXIT
          if PPTX_CHART_OUTPUT=output/pptx-chart-family-before node packages/renderers/pptx/scripts/verify-chart-families.mjs > "$RUNNER_TEMP/chart-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/chart-baseline.log"; exit 1
          fi
          python3 - <<'PY'
          import pathlib,json
          report=json.loads(pathlib.Path('output/pptx-chart-family-before/report.json').read_text())
          assert report['completed'] and report['failed']>0
          failed={x['name'] for x in report['checks'] if x['status']=='fail'}
          assert 'DPR 1: ring type, hole size, start angle and grouping survive actual parser/Worker' in failed
          assert 'DPR 1: duplicate series remain distinct and stack on the same category baseline' in failed
          PY
      - name: Prepare immutable original outside the repository
        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request,hashlib
          with urllib.request.urlopen('https://github.com/user-attachments/files/32267943/weilai.pptx',timeout=60) as response:data=response.read(2*1024*1024)
          assert len(data)==716349 and hashlib.sha256(data).hexdigest()=='be977ca8c84382b69994866fa0f5606185ff80fdbe86ec68a417e7223801e846'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'C048.pptx').write_bytes(data)
          PY
      - name: Build and verify production Worker and public viewer
        run: |
          set -euo pipefail
          npm --prefix packages/renderers/pptx run build
          cp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          cmp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          PPTX_CHART_WORKER_FILE=apps/viewer-demo/public/vendor/pptx/pptx.worker.js PPTX_CHART_ORIGINAL="$RUNNER_TEMP/C048.pptx" node packages/renderers/pptx/scripts/verify-chart-families.mjs
          node packages/renderers/pptx/scripts/verify-github-176.mjs
          node packages/renderers/pptx/scripts/verify-github-268.mjs
          PPTX_DRAWING_WORKER_FILE=apps/viewer-demo/public/vendor/pptx/pptx.worker.js node packages/renderers/pptx/scripts/verify-drawing-semantics.mjs
          node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs
      - name: Commit tested code and bounded acceptance record
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,os,shutil,hashlib,subprocess
          root=pathlib.Path('docs/regressions/evidence/pptx-chart-families-20260924');root.mkdir(parents=True,exist_ok=True)
          report=json.loads(pathlib.Path('output/pptx-chart-families/report.json').read_text());assert report['completed'] and report['passed']==27 and report['failed']==0
          assert len(report['originals'])==2 and all(x['charts']==5 for x in report['originals'])
          for source,name in [('output/pptx-chart-families/report.json','report.json'),('output/pptx-chart-family-before/report.json','baseline.json'),('output/pptx-chart-families/generated.png','generated.png'),('output/pptx-drawing-semantics/report.json','drawing-regression.json'),('output/pptx-paragraph-numbering/report.json','paragraph-regression.json')]:shutil.copyfile(source,root/name)
          assert json.loads((root/'drawing-regression.json').read_text())['passed']==26
          assert json.loads((root/'paragraph-regression.json').read_text())['passed']==11
          record={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'7e723ecc4b5bf558fbce83790775444095a32697','checks':27,'original':'C048','originalCharts':5,'dpr':[1,2],'builds':['core','pptx'],'install':'actual pnpm 11.0.9 frozen filtered workspace install; no dependency or lock changes','productionWorkerSynced':True,'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'verification.json').write_text(json.dumps(record,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## C048 图表类型专项\n\n[环形图与堆积图](pptx-chart-families-20260924.md)：C048 的空环图和堆积图误作并列图已修复，5 个原始图表的数据、75% 圆环内径与点填色在 DPR 1/2 下复测。27 项真实图表库/Worker/公开预览检查通过，生产 Worker 已同步。原稿其他文字、渐变、轴样式及全部图表高级组合仍按 P01 边界验收。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(root),str(p),'apps/viewer-demo/public/vendor/pptx/pptx.worker.js'],check=True)
          PY
          git rm -- .github/pptx-chart-family-review.b64 .github/workflows/pptx-chart-family-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pptx): render authored doughnut proportions and stacked chart groups'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
