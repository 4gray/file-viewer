name: PPTX text body verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/pptx-text-body-review.b64, .github/workflows/pptx-text-body-review.yml]
permissions:
  contents: write
concurrency:
  group: pptx-text-body-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply exact source and test changes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,base64,lzma,subprocess
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          p=d.decompress(base64.b64decode(pathlib.Path('.github/pptx-text-body-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert d.eof and not d.unused_data
          assert hashlib.sha256(p).hexdigest()=='21755acd8febe2d7e17f328169bc78fbc86d557433869cdb0e45bd4408c94074'
          subprocess.run(['git','apply','--check','-'],input=p,check=True)
          subprocess.run(['git','apply','--index','-'],input=p,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==5 and all(s.startswith(('packages/renderers/pptx/','docs/regressions/')) for s in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Actual frozen workspace install
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/text-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/text-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/core --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json
          npm --prefix packages/core run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare immutable originals outside the repository
        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'text-originals';root.mkdir()
          files=[('C049',1896517,'49f14b34e7d5b1ce7c29de55dd64a726acdea3d6dcb4b10489fb973a8446c34b','32271421/Xiaoe.AI0207_.pptx'),('C050',972288,'5a178b6c5dc63976ae4a133eaff14927ac40320609073b6e836ee7b814b1e685','32271447/xxx.2_.pptx')]
          for id,size,digest,part in files:
            with urllib.request.urlopen('https://github.com/user-attachments/files/'+part,timeout=60) as response:data=response.read(4*1024*1024+1)
            assert len(data)==size and hashlib.sha256(data).hexdigest()==digest,id
            (root/(id+'.pptx')).write_bytes(data)
          PY
      - name: Verify the previous implementation fails the target checks
        run: |
          set -euo pipefail
          for file in packages/renderers/pptx/src/chart.ts packages/renderers/pptx/src/engine/support/vendor.js; do git show "HEAD:$file" > "$file"; done
          trap 'git checkout-index -f -- packages/renderers/pptx/src/chart.ts packages/renderers/pptx/src/engine/support/vendor.js' EXIT
          npm --prefix packages/renderers/pptx run build
          if PPTX_TEXT_OUTPUT=output/pptx-text-body-before PPTX_TEXT_ORIGINALS="$RUNNER_TEMP/text-originals" node packages/renderers/pptx/scripts/verify-text-body.mjs > "$RUNNER_TEMP/text-before.log" 2>&1; then cat "$RUNNER_TEMP/text-before.log"; exit 1; fi
          python3 - <<'PY'
          import pathlib,json
          r=json.loads(pathlib.Path('output/pptx-text-body-before/report.json').read_text())
          assert r['failed']>0
          assert any(c['status']=='fail' and 'Shape AutoFit' in c['name'] for c in r['checks'])
          PY
      - name: Build and validate the fixed production Worker
        run: |
          set -euo pipefail
          npm --prefix packages/renderers/pptx run build
          cp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          cmp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          PPTX_TEXT_WORKER=apps/viewer-demo/public/vendor/pptx/pptx.worker.js PPTX_TEXT_ORIGINALS="$RUNNER_TEMP/text-originals" node packages/renderers/pptx/scripts/verify-text-body.mjs
          PPTX_PARAGRAPH_CORPUS_DIR="$RUNNER_TEMP/text-originals" node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs
          PPTX_DRAWING_WORKER_FILE=apps/viewer-demo/public/vendor/pptx/pptx.worker.js node packages/renderers/pptx/scripts/verify-drawing-semantics.mjs
          node packages/renderers/pptx/scripts/verify-chart-families.mjs
          node packages/renderers/pptx/scripts/verify-github-176.mjs
          node packages/renderers/pptx/scripts/verify-github-268.mjs
      - name: Commit verified code and neutral evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,os,shutil,hashlib,subprocess
          dst=pathlib.Path('docs/regressions/evidence/pptx-text-body-20260924');dst.mkdir(parents=True,exist_ok=True)
          reports=[('pptx-text-body','report.json',20),('pptx-paragraph-numbering','paragraphs.json',12),('pptx-drawing-semantics','drawing.json',26),('pptx-chart-families','charts.json',25)]
          counts={}
          for folder,name,count in reports:
            src=pathlib.Path('output')/folder/'report.json';r=json.loads(src.read_text());assert r['passed']==count,(folder,r['passed']);assert not r.get('failed',0)
            shutil.copyfile(src,dst/name);counts[folder]=r['passed']
          shutil.copyfile('output/pptx-text-body-before/report.json',dst/'baseline.json')
          shutil.copyfile('output/pptx-text-body/generated.png',dst/'generated.png')
          receipt={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'3f5a70a7f23d3ab1498d293d9e5af3e3d88ac7c4','originals':['C049','C050'],'checks':counts,'install':'actual pnpm 11.0.9 frozen filtered workspace install','builds':['core','pptx'],'productionWorkerSynced':True,'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir() if p.is_file()}}
          (dst/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## PPTX 文本区域与原始字号\n\n[文本区域与字号](pptx-text-body-20260924.md)：C049 九段显式9pt正文保持12 CSS像素，C050 内边距及内部段落宽度按原始XML复核。文本框不再无条件缩字，保留零基线及小数normal-AutoFit比例。20项专项、已有编号/绘图/图表回归通过，生产Worker已同步；SmartArt分区及其他未结事项不从该组结论外推。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(dst),str(p),'apps/viewer-demo/public/vendor/pptx/pptx.worker.js'],check=True)
          PY
          git rm -- .github/pptx-text-body-review.b64 .github/workflows/pptx-text-body-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pptx): preserve text insets and authored autofit typography'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
