name: PPTX diagram text verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/pptx-diagram-text-review.b64, .github/workflows/pptx-diagram-text-review.yml]
permissions:
  contents: write
concurrency:
  group: pptx-diagram-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded source and regression patch
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,lzma,base64,subprocess
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          p=d.decompress(base64.b64decode(pathlib.Path('.github/pptx-diagram-text-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert d.eof and not d.unused_data
          assert hashlib.sha256(p).hexdigest()=='b3f1960e2bc913623fa2cabe6af684eb6c6c2bd0de0be22291347336ffa26633'
          subprocess.run(['git','apply','--check','-'],input=p,check=True)
          subprocess.run(['git','apply','--index','-'],input=p,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==4 and all(x.startswith(('packages/renderers/pptx/','docs/regressions/')) for x in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Install frozen workspace and browser dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/diagram-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/diagram-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/core --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json
          npm --prefix packages/core run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare the immutable original outside the repository
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,hashlib
          with urllib.request.urlopen('https://github.com/user-attachments/files/30398372/1.1.pptx',timeout=60) as r:data=r.read(4*1024*1024)
          assert len(data)==1649977 and hashlib.sha256(data).hexdigest()=='ff4ac0df803b5d07603e8b44c7759e275d1502506f72e2ef33e1f4de4b9ee5c3'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'C016.pptx').write_bytes(data)
          PY
      - name: Reproduce old overlapping labels and missing singleton drawing
        run: |
          set -euo pipefail
          file=packages/renderers/pptx/src/engine/support/vendor.js
          git show "HEAD:$file" > "$file"
          trap 'git checkout-index -f -- packages/renderers/pptx/src/engine/support/vendor.js' EXIT
          npm --prefix packages/renderers/pptx run build
          if PPTX_DIAGRAM_OUTPUT=output/pptx-diagram-before PPTX_DIAGRAM_ORIGINAL="$RUNNER_TEMP/C016.pptx" node packages/renderers/pptx/scripts/verify-diagram-text.mjs > "$RUNNER_TEMP/diagram-before.log" 2>&1; then cat "$RUNNER_TEMP/diagram-before.log"; exit 1; fi
          python3 - <<'PY'
          import pathlib,json
          r=json.loads(pathlib.Path('output/pptx-diagram-before/report.json').read_text());assert r['completed'] and r['failed']>0
          failed=[c['name'] for c in r['checks'] if c['status']=='fail']
          assert any('C016' in n and 'do not overlap' in n for n in failed)
          assert any('single cached shape' in n for n in failed)
          PY
      - name: Verify fixed production Worker, public viewer and prior suites
        run: |
          set -euo pipefail
          npm --prefix packages/renderers/pptx run build
          cp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          cmp packages/renderers/pptx/dist/worker/pptx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js
          PPTX_DIAGRAM_WORKER=apps/viewer-demo/public/vendor/pptx/pptx.worker.js PPTX_DIAGRAM_ORIGINAL="$RUNNER_TEMP/C016.pptx" node packages/renderers/pptx/scripts/verify-diagram-text.mjs
          PPTX_TEXT_WORKER=apps/viewer-demo/public/vendor/pptx/pptx.worker.js node packages/renderers/pptx/scripts/verify-text-body.mjs
          PPTX_DRAWING_WORKER_FILE=apps/viewer-demo/public/vendor/pptx/pptx.worker.js node packages/renderers/pptx/scripts/verify-drawing-semantics.mjs
          node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs
          node packages/renderers/pptx/scripts/verify-chart-families.mjs
          node packages/renderers/pptx/scripts/verify-github-176.mjs
          node packages/renderers/pptx/scripts/verify-github-268.mjs
      - name: Push verified source and neutral evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,shutil,os,hashlib,subprocess
          dst=pathlib.Path('docs/regressions/evidence/pptx-diagram-text-20260924');dst.mkdir(parents=True,exist_ok=True)
          reports=[('pptx-diagram-text','report.json',23),('pptx-text-body','text.json',16),('pptx-drawing-semantics','drawing.json',26),('pptx-paragraph-numbering','paragraphs.json',11),('pptx-chart-families','charts.json',25)]
          counts={}
          for directory,name,count in reports:
            src=pathlib.Path('output')/directory/'report.json';r=json.loads(src.read_text());assert r['passed']==count,(directory,r['passed']);assert not r.get('failed',0)
            shutil.copyfile(src,dst/name);counts[directory]=count
          shutil.copyfile('output/pptx-diagram-before/report.json',dst/'baseline.json')
          shutil.copyfile('output/pptx-diagram-text/generated.png',dst/'generated.png')
          record={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'39b6779776e68a82f601fb00af00142bb7decd5a','original':'C016','textRegions':6,'checks':counts,'builds':['core','pptx'],'install':'actual pnpm 11.0.9 frozen filtered workspace installation','productionWorkerSynced':True,'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir() if p.is_file()}}
          (dst/'verification.json').write_text(json.dumps(record,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## SmartArt 文本区域\n\n[独立文本区域](pptx-diagram-text-20260924.md)：C016 六个标签按原稿布局约束和模型关系恢复独立区域，DPR 1/2 下与独立 XML 计算一致且无重叠；修复独立文本变换未用于位置/宽高及单缓存形状丢失。23项专项和既有文本/图表/绘制/编号回归通过，生产Worker同步。仅覆盖明确支持的约束，不据此宣称完整SmartArt布局引擎或其余全部样例结项。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(dst),str(p),'apps/viewer-demo/public/vendor/pptx/pptx.worker.js'],check=True)
          PY
          git rm -- .github/pptx-diagram-text-review.b64 .github/workflows/pptx-diagram-text-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pptx): recover independent diagram text regions from authored constraints'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
