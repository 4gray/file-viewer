name: DOCX grid metrics verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [scripts/lib/docx-grid-metrics.mjs, scripts/prepare-docx-grid-metrics.mjs, scripts/verify-docx-grid-metrics.mjs, test/docx-grid-metrics/**, .github/workflows/docx-grid-metrics-review.yml]
permissions:
  contents: write
concurrency:
  group: docx-grid-metrics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install the baseline frozen workspace
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/grid-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/grid-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          npm --prefix packages/core run build
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          git diff --exit-code -- pnpm-lock.yaml patches/ packages/core/src/platform/assets.ts
      - name: Prepare Chromium and original
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python3 - <<'PY'
          import pathlib,os,hashlib,urllib.request
          with urllib.request.urlopen('https://github.com/user-attachments/files/29026887/-.3.docx',timeout=60) as response:data=response.read(1024*1024)
          assert len(data)==24181 and hashlib.sha256(data).hexdigest()=='0b6a601d5c98fb9d543a0baf4afce712f79831710ca6de4a383a1f69c89428a8'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'C005.docx').write_bytes(data)
          PY
      - name: Reproduce actual original paint overlap before the repair
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if DOCX_GRID_ORIGINAL="$RUNNER_TEMP/C005.docx" DOCX_GRID_OUTPUT=output/docx-grid-metrics-before node scripts/verify-docx-grid-metrics.mjs; then exit 1; fi
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('output/docx-grid-metrics-before/report.json').read_text())
          assert r['completed'] and r['failed']>0
          targets=[s for s in r['samples'] if s['id']=='C005']
          assert len(targets)==4 and all(s['minimumShadingGap']<-.5 for s in targets)
          assert any(c['status']=='fail' and 'C005' in c['name'] and 'occluded' in c['name'] for c in r['checks'])
          PY
      - name: Rebuild declared five-entry patch and verify fixed content
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/prepare-docx-grid-metrics.mjs
          npm --prefix packages/core run build
          npm --prefix packages/renderers/word run build
          node --test test/docx-grid-metrics/inline.test.mjs
          DOCX_GRID_ORIGINAL="$RUNNER_TEMP/C005.docx" node scripts/verify-docx-grid-metrics.mjs
          node scripts/verify-docx-engine-compatibility.mjs
      - name: Verify a fresh frozen install of the new patch and static Worker
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/grid-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts --force
          npm --prefix packages/core run build
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          DOCX_GRID_WORKER=apps/viewer-demo/public/vendor/docx/docx.worker.js DOCX_GRID_ORIGINAL="$RUNNER_TEMP/C005.docx" node scripts/verify-docx-grid-metrics.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          node scripts/verify-container-compatibility.mjs
          for name in table-spec github-34 github-87 github-171 github-192 github-236; do node "packages/renderers/doc/scripts/verify-$name.mjs"; done
      - name: Commit verified runtime integration and neutral evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,hashlib,os,shutil,subprocess
          dst=pathlib.Path('docs/regressions/evidence/docx-grid-metrics-20260924');dst.mkdir(parents=True,exist_ok=True)
          reports=[('output/docx-grid-metrics/report.json','report.json',49),('output/docx-engine-compatibility/report.json','engine.json',11),('output/container-compatibility/report.json','containers.json',4)]
          for source,name,count in reports:
            r=json.loads(pathlib.Path(source).read_text());assert r['passed']==count and not r.get('failed',0),(name,r)
            shutil.copyfile(source,dst/name)
          shutil.copyfile('output/docx-grid-metrics-before/report.json',dst/'baseline.json')
          shutil.copyfile('output/docx-grid-metrics/generated.png',dst/'generated.png')
          record={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'2fc54c12293aa9a9ffae03d642553450be49f8df','original':'C005','bodyTextCharacters':4951,'literalTabs':1,'checks':49,'inlineUnitChecks':6,'wordPackageTests':74,'originalPaintOverlapReproduced':True,'actualWorkerParsed':True,'workerUpdated':True,'install':'actual frozen pnpm 11.0.9 filtered installation after regenerating the declared patch','builds':['core','doc','word'],'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.iterdir() if p.is_file()}}
          (dst/'verification.json').write_text(json.dumps(record,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## C005 网格行距与底纹遮挡\n\n[行内字体度量](docx-grid-metrics-20260924.md)：修复自动行距与网格组合时较大字号/上下标继承固定行高、后续底纹盖住前段文字的问题，同时保留不同CSS单位的段落最小高度。原样4,951文字字符及1个制表符保留；49项实际renderer/Worker/缩放/导出检查通过，五入口补丁、冻结锁和静态Worker已同步验证。页数随恢复后的自然行高计算，不硬编码缓存页数；其他原稿与真实宿主范围不由本组结论替代。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(dst),str(p),'patches/@file-viewer__docx@0.3.32.patch','patches/docx-engine-compatibility.json','pnpm-lock.yaml','packages/core/src/platform/assets.ts','apps/viewer-demo/public/vendor/docx/docx.worker.js'],check=True)
          PY
          git rm -- .github/workflows/docx-grid-metrics-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): preserve inline metrics in automatic grid-spaced paragraphs'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
