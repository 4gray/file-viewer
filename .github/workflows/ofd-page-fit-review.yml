name: OFD page fit verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply verified precision correction
        run: |
          git apply --check .github/ofd-page-fit.patch
          git apply --index .github/ofd-page-fit.patch
      - name: Install actual OFD dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ofd-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const dir of ['core','renderers/ofd']){
            const p=JSON.parse(fs.readFileSync(`packages/${dir}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ofd-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/ofd-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/ofd-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Build and execute page, image and text regressions
        run: |
          set -euo pipefail
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/ofd-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/ofd-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/ofd run build
          mkdir -p output/ofd-page-fit
          node packages/renderers/ofd/scripts/verify-page-fit.mjs | tee output/ofd-page-fit/report.json
          for name in verify-github-94 verify-image-placement verify-pageblock-render verify-render-fidelity verify-github-177 verify-github-266; do
            node "packages/renderers/ofd/scripts/$name.mjs" | tee "output/ofd-page-fit/$name.log"
          done
      - name: Push tested source and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,os,shutil
          root=pathlib.Path('docs/regressions/evidence/ofd-layout-20260923')
          report=json.loads(pathlib.Path('output/ofd-page-fit/report.json').read_text());assert report['passed']==25
          shutil.copyfile('output/ofd-page-fit/report.json',root/'ci-report.json')
          (root/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'checks':25,'existingSuites':6,'scope':'Core and OFD builds; 25 geometry combinations and six existing suites. Six original-file browser checks ran locally with hash-pinned bytes.'},indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/ofd-layout-20260923
          git rm -- .github/ofd-page-fit.patch .github/workflows/ofd-page-fit-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ofd): preserve exact page-fit scale and verify original text geometry'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
