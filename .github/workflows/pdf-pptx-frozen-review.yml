name: Frozen PDF and PPTX verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
concurrency:
  group: pdf-pptx-frozen-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply reviewed test dependency declarations
        run: |
          set -euo pipefail
          echo 'd284a2451332755de7c77cc2743af17f7a17afb2ced67a85ac42c77d86a12dca  .github/pdf-test-portability.patch' | sha256sum --check
          git apply --check .github/pdf-test-portability.patch
          git apply --index .github/pdf-test-portability.patch
      - name: Install selected workspace packages from the frozen lock
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pnpm-tool" --ignore-scripts --no-audit --no-fund pnpm@11.0.9
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/core --filter @file-viewer/renderer-pdf --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
      - name: Build and verify actual workspace resolution
        run: |
          set -euo pipefail
          npm --prefix packages/core run build
          npm --prefix packages/renderers/pdf run build
          npm --prefix packages/renderers/pptx run build
          node node_modules/playwright/cli.js install --with-deps chromium
          node packages/renderers/pdf/scripts/verify-viewport-lifecycle.mjs
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check
          node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs
          node packages/renderers/pptx/scripts/verify-github-176.mjs
          node packages/renderers/pptx/scripts/verify-github-268.mjs
      - name: Push portable test setup and freeze-install evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,os,shutil
          dest=pathlib.Path('docs/regressions/evidence/pdf-pptx-frozen-20260923');dest.mkdir(parents=True,exist_ok=True)
          for directory,name,count in [('pdf-viewport-lifecycle','pdf',9),('pptx-paragraph-numbering','pptx',11)]:
            p=pathlib.Path('output')/directory/'report.json';r=json.loads(p.read_text());assert r['passed']==count
            shutil.copyfile(p,dest/(name+'.json'))
          (dest/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'install':'actual pnpm 11.0.9 frozen-lockfile filtered install with declared patches; not lockfile-only','packages':['workspace-root tooling','core','renderer-pdf','pptx'],'builds':3,'checks':{'pdfLifecycle':9,'pptxParagraph':11,'existingPptxSuites':2},'fullWorkspaceBuild':False},indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/pdf-pptx-frozen-20260923
          git rm -- .github/pdf-test-portability.patch .github/workflows/pdf-pptx-frozen-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pdf): resolve declared package dependencies under frozen pnpm installs'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
