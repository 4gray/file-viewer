name: Container compatibility verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded verified source changes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,base64,lzma,subprocess
          data=base64.b64decode(pathlib.Path('.github/corpus-review/containers.b64').read_text().strip(),validate=True)
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=d.decompress(data,max_length=2*1024*1024)
          assert d.eof and not d.unused_data
          assert hashlib.sha256(patch).hexdigest()=='f390e27474a17cac39987b4d2b96fadfc004a0053e3728be160005eaa7a9719a'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==12 and all('node_modules' not in pathlib.PurePosixPath(p).parts and not p.startswith('.github/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Install actual verification dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/verify-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const dir of ['core','renderers/doc','renderers/word','renderers/pptx']){
            const p=JSON.parse(fs.readFileSync(`packages/${dir}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies})) dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2',jsdom:'27.4.0'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/verify-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/verify-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/verify-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Build source packages and existing Word regressions
        run: |
          set -euo pipefail
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/doc run build
          rm -rf "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/doc"
          ln -s "$GITHUB_WORKSPACE/packages/renderers/doc" "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/doc"
          npm --prefix packages/renderers/pptx run build
          npm --prefix packages/renderers/word run build
      - name: Run generated-fixture browser and relationship checks
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          node scripts/verify-container-compatibility.mjs
      - name: Push tested source and remove temporary transport
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          cp output/container-compatibility/report.json docs/regressions/evidence/container-compatibility-20260922/report.json
          cp output/container-compatibility/word-html.png docs/regressions/evidence/container-compatibility-20260922/word-html.png
          git add -- docs/regressions/evidence/container-compatibility-20260922
          git rm -- .github/corpus-review/containers.b64 .github/workflows/corpus-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(renderers): recover SVG pictures and legacy text Word containers'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
