name: Corpus verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare pinned verification runtime
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-runtime" "$RUNNER_TEMP/corpus-artifact"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const dependencies = {};
          for (const pkg of ['core','renderers/doc','renderers/word','renderers/pdf','renderers/text','renderers/pptx','renderers/ofd','renderers/spreadsheet','renderers/archive','renderers/eda','renderers/ebook','renderers/email','renderers/media']) {
            const p = JSON.parse(fs.readFileSync(`packages/${pkg}/package.json`,'utf8'));
            for (const [name, version] of Object.entries({...p.dependencies,...p.devDependencies})) {
              dependencies[name] = version.startsWith('workspace:') ? version.slice(10) : version.replace(/^[~^]/,'');
            }
          }
          Object.assign(dependencies, {playwright:'1.63.0',esbuild:'0.28.2','billboard.js':'3.18.0','d3-format':'3.1.2','@file-viewer/vite-plugin':'3.1.2',vitest:'4.1.8',vite:'8.3.0'});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'corpus-runtime/package.json'),JSON.stringify({private:true,type:'module',dependencies},null,2));
          JS
          cd "$RUNNER_TEMP/corpus-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          tar -czf "$RUNNER_TEMP/corpus-artifact/runtime.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          git ls-tree -r HEAD > "$RUNNER_TEMP/corpus-artifact/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/corpus-artifact/head.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: corpus-runtime
          path: ${{ runner.temp }}/corpus-artifact/
          retention-days: 2
          compression-level: 0
