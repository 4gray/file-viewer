name: DOCX engine integration verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply content-verified source integration
        run: python3 .github/docx-integration/apply.py source
      - name: Install real verification dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/verify-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const dir of ['core','renderers/doc','renderers/pptx','renderers/word','renderers/pdf','renderers/text']){
            const p=JSON.parse(fs.readFileSync(`packages/${dir}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies})) dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2','billboard.js':'3.18.0','d3-format':'3.1.2','@xmldom/xmldom':'0.9.12',pnpm:'11.0.9'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/verify-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/verify-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          ln -s "$RUNNER_TEMP/verify-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          ln -s "$RUNNER_TEMP/verify-runtime/node_modules" "$GITHUB_WORKSPACE/packages/renderers/pdf/node_modules"
      - name: Reconstruct and validate all five engine entries
        run: |
          NODE_PATH="$RUNNER_TEMP/verify-runtime/node_modules" python3 .github/docx-integration/apply.py runtime
      - name: Validate the frozen workspace lock without installing the full workspace
        run: |
          node node_modules/pnpm/bin/pnpm.cjs install --lockfile-only --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
      - name: Build six owning packages
        run: |
          set -euo pipefail
          mkdir -p output/docx-engine-compatibility
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/doc run build
          rm -rf "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/doc"
          ln -s "$GITHUB_WORKSPACE/packages/renderers/doc" "$RUNNER_TEMP/verify-runtime/node_modules/@file-viewer/doc"
          for package in pptx word pdf text; do npm --prefix "packages/renderers/$package" run build; done
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check
      - name: Verify actual Worker and prior renderer regressions
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node scripts/verify-docx-engine-compatibility.mjs
          node scripts/verify-container-compatibility.mjs
          node scripts/verify-compatibility-review.mjs
      - name: Push verified integration and generated evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import os,pathlib,json,shutil,hashlib,subprocess
          output=pathlib.Path('output/docx-engine-compatibility')
          dest=pathlib.Path('docs/regressions/evidence/docx-engine-compatibility-20260922')
          dest.mkdir(parents=True,exist_ok=True)
          for name in ['report.json','geometry.json','worker.json','charts.png']: shutil.copyfile(output/name,dest/name)
          assert json.loads((dest/'report.json').read_text())['passed']==11
          shutil.copyfile('output/compatibility-review/report.json',dest/'previous-report.json')
          shutil.copyfile('output/container-compatibility/report.json',dest/'containers-report.json')
          assert json.loads((dest/'previous-report.json').read_text())['passed']==36
          receipt={'run':os.environ['GITHUB_RUN_ID'],'engineCommit':'4236e8ad0d9a37563cb93a4fb1b9f2fce295d5e7','scope':'six owning builds; frozen workspace lock-only check; 11 engine checks, 36 prior checks, container regressions; not a full workspace release build','sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.iterdir() if p.is_file()}}
          (dest/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          subprocess.run(['git','add','--',str(dest)],check=True)
          PY
          git rm -- .github/docx-integration/part-0.txt .github/docx-integration/part-1.txt .github/docx-integration/apply.py .github/docx-integration/worker-dom.cjs .github/workflows/docx-integration.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): integrate chart geometry and working offline XML Worker'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
