name: DOCX paragraph flow verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
concurrency:
  group: docx-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install baseline using the actual frozen workspace lock
        run: |
          npm install --global pnpm@11.0.9 --ignore-scripts --no-audit --no-fund
          pnpm --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/renderer-word... --filter @file-viewer/pptx... install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
      - name: Rebuild the five-entry patch and Worker cache identity
        run: |
          node scripts/prepare-docx-paragraph-flow.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-docx-engine-compatibility.mjs');s=p.read_text()
          before="  assert.match(url,/file-viewer-docx=0\\.3\\.32%2Bcompat\\.20260922/);"
          after="  const pin=JSON.parse(await readFile(path.join(root,'patches/docx-engine-compatibility.json'),'utf8'));\n  assert.equal(new URL(url).searchParams.get('file-viewer-docx'),pin.runtimeVersion||'0.3.32+compat.20260922');"
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          PY
          pnpm --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/renderer-word... --filter @file-viewer/pptx... install --frozen-lockfile --ignore-scripts
      - name: Build actual workspace packages
        run: |
          set -euo pipefail
          pnpm --filter @file-viewer/core build
          pnpm --filter @file-viewer/doc build
          pnpm --filter @file-viewer/pptx build
          pnpm --filter @file-viewer/renderer-word build
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify parser, Worker, complete page geometry and existing charts
        run: |
          set -euo pipefail
          node packages/renderers/word/scripts/verify-paragraph-flow.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          node scripts/prepare-docx-paragraph-flow.mjs --baseline-only
      - name: Push verified code and generated-only evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,shutil,os,hashlib,subprocess
          output=pathlib.Path('output/docx-paragraph-flow');dest=pathlib.Path('docs/regressions/evidence/docx-paragraph-flow-20260923')
          dest.mkdir(parents=True,exist_ok=True)
          report=json.loads((output/'report.json').read_text());assert report['passed']==11 and not report['errors'] and not report['external']
          prior=json.loads(pathlib.Path('output/docx-engine-compatibility/report.json').read_text());assert prior['passed']==11
          shutil.copyfile(output/'report.json',dest/'ci-report.json')
          shutil.copyfile(output/'generated.png',dest/'generated.png')
          shutil.copyfile('output/docx-engine-compatibility/report.json',dest/'prior-engine.json')
          pins=json.loads(pathlib.Path('patches/docx-engine-compatibility.json').read_text())
          verification={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baselineCommit':'7d493f5fbd7978c47e96e26f0e1570e2a81115c7','install':'actual pnpm 11.0.9 frozen filtered install before and after rebuilding declared engine patch','builds':['core','doc','pptx','word'],'checks':{'paragraphFlow':11,'previousEngine':11},'patchSha256':pins['patchSha256'],'upstreamSourceBuild':False,'fullWorkspaceBuild':False,'originalsInCi':False}
          (dest/'verification.json').write_text(json.dumps(verification,indent=2)+'\n')
          paths=['patches/@file-viewer__docx@0.3.32.patch','patches/docx-engine-compatibility.json','pnpm-lock.yaml','packages/core/src/platform/assets.ts','scripts/verify-docx-engine-compatibility.mjs','apps/viewer-demo/public/vendor/docx/docx.worker.js',str(dest)]
          subprocess.run(['git','add','--']+paths,check=True)
          PY
          git rm -- .github/workflows/docx-paragraph-flow-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): preserve valid paragraph gaps and batch safe pagination tails'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
