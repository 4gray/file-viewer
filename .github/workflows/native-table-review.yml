name: Native DOC table verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/native-table-review.b64, .github/workflows/native-table-review.yml]
permissions:
  contents: write
concurrency:
  group: native-table-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded content-verified source patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(base64.b64decode(pathlib.Path('.github/native-table-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest()=='364deb3f23699a4ee70fc05cd3731c475b330fa447f14094d86e1f8dd4d4a3f5'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==5 and all(p.startswith(('packages/renderers/doc/','docs/regressions/')) for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Install exact workspace dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/native-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json
          npm --prefix packages/core run build
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare immutable originals outside the repository
        run: |
          python3 - <<'PY'
          import pathlib,os,hashlib,urllib.request,io,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-originals';root.mkdir()
          entries=[('C001',11441152,'275fcd589ec2cafe1e96fd2634d1b001b7ce055434a5618459179408ee8dda98','https://zzxiaozhi.oss-cn-beijing.aliyuncs.com/241fb56f07ba45fda17493e193f42058/doc/58a3b4eb-679c-45cd-bf90-9f466677cbcc.doc'),('C056',37376,'c61860b68b3b04e4ee2d00516dba1102fda84a51c559f1217ccb285940b5697c','https://github.com/user-attachments/files/32429705/23.doc'),('C057',37376,'55e95c66c431ce7ca0fffc4fb296ad5d9beaefd9caf40ce9c1f648ff8849c7b6','https://github.com/user-attachments/files/32429708/1111233.doc')]
          def fetch(url):
            with urllib.request.urlopen(url,timeout=90) as r:data=r.read(16*1024*1024+1)
            assert len(data)<=16*1024*1024
            return data
          for id,size,digest,url in entries:
            data=fetch(url);assert len(data)==size and hashlib.sha256(data).hexdigest()==digest,id
            (root/(id+'.doc')).write_bytes(data)
          data=fetch('https://github.com/user-attachments/files/31734252/default.zip')
          assert hashlib.sha256(data).hexdigest()=='e562163940282e3a51e5b0a506ef655e62aa51ef77a6e22666ff6c60d7a07703'
          found=False
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            for info in z.infolist():
              if info.is_dir() or info.file_size!=115200:continue
              original=z.read(info)
              if hashlib.sha256(original).hexdigest()=='20d54c7246abc43147c6145abdef283cac113fdbf684387bfdc69b9df9887e94':
                (root/'C069.doc').write_bytes(original);found=True
          assert found
          PY
      - name: Reproduce the original flattened-table defect
        run: |
          set -euo pipefail
          parser=packages/renderers/doc/src/msdoc/parser.ts
          git show "HEAD:$parser" > "$parser"
          trap 'git checkout-index -f -- packages/renderers/doc/src/msdoc/parser.ts' EXIT
          npm --prefix packages/renderers/doc run build
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          import {parseMsDoc} from './packages/renderers/doc/dist/index.js';
          const d=parseMsDoc(fs.readFileSync(process.env.RUNNER_TEMP+'/native-originals/C001.doc'));
          const tables=d.blocks.filter(b=>b.type==='table');assert.equal(tables.length,1);assert.equal(tables[0].rows.length,17);
          let text='';for(const b of d.blocks){if(b.type==='paragraph')text+=b.text;else if(b.type==='table')for(const r of b.rows)for(const c of r.cells)for(const p of c.paragraphs)text+=p.text;}
          assert.equal(createHash('sha256').update(text).digest('hex'),'24b3168da086ae9f8f3dce893780b60cae22cfbaa87b2cad4caeb7a53bb048b4');
          fs.mkdirSync('output/native-baseline',{recursive:true});fs.writeFileSync('output/native-baseline/report.json',JSON.stringify({id:'C001',tables:1,rows:17,characters:text.length,images:d.assets.length,targetReproduced:true},null,2)+'\n');
          JS
      - name: Verify actual parser, Worker, viewer and existing regressions
        run: |
          set -euo pipefail
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          NATIVE_TABLE_CORPUS_DIR="$RUNNER_TEMP/native-originals" node packages/renderers/doc/scripts/verify-nested-tables.mjs
          for name in table-spec github-34 github-87 github-171 github-192 github-236; do node "packages/renderers/doc/scripts/verify-$name.mjs"; done
          node scripts/verify-container-compatibility.mjs
          node scripts/verify-docx-engine-compatibility.mjs
      - name: Commit verified source and neutral evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,os,hashlib,shutil,subprocess
          root=pathlib.Path('docs/regressions/evidence/native-doc-tables-20260924');root.mkdir(parents=True,exist_ok=True)
          report=json.loads(pathlib.Path('output/native-tables/report.json').read_text());assert report['completed'] and report['passed']==22 and report['failed']==0 and len(report['originals'])==8
          for source,name in [('output/native-tables/report.json','report.json'),('output/native-baseline/report.json','baseline.json'),('output/native-tables/generated-1.png','generated.png'),('output/container-compatibility/report.json','containers.json'),('output/docx-engine-compatibility/report.json','engine.json')]:shutil.copyfile(source,root/name)
          assert json.loads((root/'containers.json').read_text())['passed']==4
          assert json.loads((root/'engine.json').read_text())['passed']==11
          receipt={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'196c81be07216586d3bacb863ef220bcaef817bb','checks':22,'originalDocuments':4,'dpr':[1,2],'zoom':[0.5,1,2],'builds':['core','doc','word'],'install':'actual pnpm 11.0.9 frozen filtered workspace install','existingDocGates':6,'wordPackageTests':20,'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');rows=p.read_text().splitlines()
          for i,row in enumerate(rows):
            if row.startswith('| W01 '):rows[i]='| W01 Word 内容识别与旧格式 | 保留文本/HTML/WordML 的已有修复；**C001 原生 DOC 嵌套表格结构已修复**，16 表/82 行、3,464 字符文本序列和 12 图保留；C056/C057/C069 真实 Worker、公开预览与缩放回归通过 | 原稿全部分页、字体度量、图片/印章位置及桌面应用视觉一致性，不能用结构恢复代替 |'
          p.write_text('\n'.join(rows)+'\n\n## 原生 DOC 表格专项\n\n见 [嵌套表格与内容完整性](native-doc-tables-20260924.md)。此批只结清有原样证据的结构与解码子项；未扩大到整个资料包或所有 Word 版式。\n')
          subprocess.run(['git','add','--',str(root),str(p)],check=True)
          PY
          git rm -- .github/native-table-review.b64 .github/workflows/native-table-review.yml
          if test -f .github/workflows/closure-source-20260924.yml; then git rm -- .github/workflows/closure-source-20260924.yml; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(doc): restore nested table boundaries and ordered cell content'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
