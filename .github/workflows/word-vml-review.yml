name: Word VML text geometry verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/word-vml-review.b64, .github/workflows/word-vml-review.yml]
permissions:
  contents: write
concurrency:
  group: word-vml-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded source changes and regression checks
        run: |
          python3 - <<'PY'
          import pathlib,lzma,base64,hashlib,subprocess
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=d.decompress(base64.b64decode(pathlib.Path('.github/word-vml-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert d.eof and not d.unused_data
          assert hashlib.sha256(patch).hexdigest()=='266d7d0b30a097c483256378a6a089ab53e86d594cb60cb965b1ebf16505ff73'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          expected={'packages/renderers/word/src/docxAnchors.ts','packages/renderers/word/src/docxVml.ts','packages/renderers/word/src/wordDocx.ts','packages/renderers/word/test/docx-vml-layout.test.mjs','packages/renderers/word/scripts/verify-vml-text-layout.mjs','docs/regressions/word-vml-text-20260924.md'}
          assert set(paths)==expected
          p=pathlib.Path('docs/regressions/word-vml-text-20260924.md');s=p.read_text();old='本批结清 C037 已复现的文本相对锚点、附带线条定位及文本框二次字号缩放问题';new='本批结清 C037 已复现的文本相对锚点和文本框二次字号缩放问题；附带线条的坐标属于既有行为回归';assert s.count(old)==1;p.write_text(s.replace(old,new));subprocess.run(['git','add','--',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Actual frozen workspace installation and owning builds
        run: |
          set -euo pipefail
          mkdir -p output/word-vml-build
          npm install --prefix "$RUNNER_TEMP/vml-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/vml-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json patches/ apps/viewer-demo/public/vendor/docx/
          npm --prefix packages/core run build 2>&1 | tee output/word-vml-build/core.log
          npm --prefix packages/renderers/doc run build 2>&1 | tee output/word-vml-build/doc.log
          npm --prefix packages/renderers/word run build 2>&1 | tee output/word-vml-build/word.log
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare hash-fixed originals outside the repository
        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request,hashlib,zipfile,io
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'vml-originals';root.mkdir()
          def fetch(url):
            with urllib.request.urlopen(url,timeout=90) as r:data=r.read(16*1024*1024+1)
            assert len(data)<=16*1024*1024
            return data
          entries=[('C037.docx',299642,'d5a60516f06b7f116c629fdbc834b81ae8a0d7ac70e64006483d2a4c44ff89ab','31549497/2025.19.-.docx'),('C030.docx',411152,'4b2e9b2519af88f32cec9c4e0622ca7979f5c768c569819d48e26355001cb467','31128086/asdf.docx')]
          for name,size,sha,suffix in entries:
            data=fetch('https://github.com/user-attachments/files/'+suffix);assert len(data)==size and hashlib.sha256(data).hexdigest()==sha,name;(root/name).write_bytes(data)
          archive=fetch('https://github.com/user-attachments/files/31734252/default.zip');assert hashlib.sha256(archive).hexdigest()=='e562163940282e3a51e5b0a506ef655e62aa51ef77a6e22666ff6c60d7a07703'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            for info in z.infolist():
              if info.is_dir() or info.file_size!=26086:continue
              data=z.read(info)
              if hashlib.sha256(data).hexdigest()=='7b9380a4c80eb4c17b8f3c7d2b69b4c012d2c2ff1e1d58125ee7cb8bfc07e35d':(root/'C070.doc').write_bytes(data)
          assert (root/'C070.doc').is_file()
          PY
      - name: Reproduce old origin and font scale failures
        run: |
          set -euo pipefail
          source=packages/renderers/word/src/wordDocx.ts
          git show "HEAD:$source" > "$source"
          trap 'git checkout-index -f -- packages/renderers/word/src/wordDocx.ts' EXIT
          if WORD_VML_ORIGINAL="$RUNNER_TEMP/vml-originals/C037.docx" WORD_VML_OUTPUT=output/word-vml-before node packages/renderers/word/scripts/verify-vml-text-layout.mjs > "$RUNNER_TEMP/vml-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/vml-baseline.log"; exit 1
          fi
          python3 - <<'PY'
          import pathlib,json
          r=json.loads(pathlib.Path('output/word-vml-before/report.json').read_text());assert r['completed'] and r['failed']>0
          failures=[x['name'] for x in r['checks'] if x['status']=='fail']
          assert any(x.startswith('C037 DPR 1') and 'origins and shape extents' in x for x in failures)
          assert any(x.startswith('C037 DPR 1') and 'physical font sizes' in x for x in failures)
          PY
      - name: Verify fixed original, actual Worker, export and prior renderer paths
        run: |
          set -euo pipefail
          WORD_VML_ORIGINAL="$RUNNER_TEMP/vml-originals/C037.docx" node packages/renderers/word/scripts/verify-vml-text-layout.mjs
          WORD_TABS_ORIGINAL="$RUNNER_TEMP/vml-originals/C030.docx" node packages/renderers/word/scripts/verify-explicit-tabs.mjs
          WORDML_REVIEW_ORIGINAL="$RUNNER_TEMP/vml-originals/C070.doc" node packages/renderers/word/scripts/verify-wordml-encoding-defaults.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          node scripts/verify-container-compatibility.mjs
          for name in table-spec github-34 github-87 github-171 github-192 github-236; do node "packages/renderers/doc/scripts/verify-$name.mjs"; done
      - name: Push verified source and neutral acceptance evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,hashlib,os,shutil,subprocess,re
          root=pathlib.Path('docs/regressions/evidence/word-vml-text-20260924');root.mkdir(parents=True,exist_ok=True)
          r=json.loads(pathlib.Path('output/word-vml-text/report.json').read_text());assert r['completed'] and r['passed']==57 and r['failed']==0
          originals=[x for x in r['originals'] if x['id']=='C037'];assert len(originals)==2 and all(x['characters']==6034 and x['images']==5 and len(x['shapes'])==3 for x in originals)
          records=[('output/word-vml-text/report.json','report.json'),('output/word-vml-before/report.json','baseline.json'),('output/word-vml-before/generated.png','before.png'),('output/word-vml-text/generated.png','after.png'),('output/word-explicit-tabs/report.json','tabs.json'),('output/wordml-encoding-defaults/report.json','wordml.json'),('output/docx-engine-compatibility/report.json','engine.json'),('output/container-compatibility/report.json','containers.json')]
          for src,name in records:shutil.copyfile(src,root/name)
          for name,count in [('tabs.json',27),('wordml.json',19),('engine.json',11),('containers.json',4)]:assert json.loads((root/name).read_text())['passed']==count,name
          log=pathlib.Path('output/word-vml-build/word.log').read_text();assert re.search(r'\btests\s+63\b',log) and re.search(r'\bpass\s+63\b',log)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          receipt={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'9f3fedf7a799e6d6db6d1660123c0d585300a26d','rootCauses':2,'original':'C037','checks':57,'unitTestsAdded':16,'wordUnitTests':63,'priorChecks':{'C030Tabs':27,'C070Wordml':19,'engine':11,'containers':4},'dpr':[1,2],'zoom':[1,0.5,2,0.88,1],'actualWorkerParsed':True,'export':'real export adapter HTML; physical print driver not tested','builds':['core','doc','word'],'install':'actual pnpm 11.0.9 frozen filtered workspace install; dependencies, lock, engine patch and static Worker unchanged','fullCorpusAccepted':False,'sourceSha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},'evidenceSha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## C037 VML 锚点与字号\n\n[文本相对锚点与物理字号](word-vml-text-20260924.md)：署名文本框额外叠加段落缩进和字体二次缩放两项根因已修复，C037 的 3 个 VML 对象按独立 XML 坐标验收，9 个署名字符落在原视口内；6,034 个正文字符与 5 张图片保留。57 项实际浏览器/Worker/导出与缩放检查、63 项 Word 单元测试及既有 C030/C070/引擎/容器回归通过。附带线条是坐标回归，不重复计为缺陷；不将本结论扩大为所有印章、跨页表格或 W02 全部版式通过。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(root),str(p)],check=True)
          PY
          git rm -- .github/word-vml-review.b64 .github/workflows/word-vml-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): preserve VML text origins and physical textbox font sizes'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
