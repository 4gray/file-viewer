name: Word explicit tab verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/word-tab-review.b64, .github/workflows/word-tab-review.yml]
permissions:
  contents: write
concurrency:
  group: word-tab-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply hash-verified source and tests
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=d.decompress(base64.b64decode(pathlib.Path('.github/word-tab-review.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert d.eof and not d.unused_data
          assert hashlib.sha256(patch).hexdigest()=='a770291fb19ef2f6ac038e5e8ed441c487385b3bfa145e8aa30490cd3ea89b10'
          assert subprocess.check_output(['git','hash-object','packages/renderers/word/src/wordDocx.ts'],text=True).strip()=='842cf802880d51b7723603d0b97aab080740e10e'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==5 and all(p.startswith(('packages/renderers/word/','docs/regressions/')) for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Actual frozen workspace install and owning builds
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tab-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/tab-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json patches/
          npm --prefix packages/core run build
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare immutable original outside the repository
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,os,hashlib
          with urllib.request.urlopen('https://github.com/user-attachments/files/31128086/asdf.docx',timeout=60) as r:data=r.read(2*1024*1024)
          assert len(data)==411152 and hashlib.sha256(data).hexdigest()=='4b2e9b2519af88f32cec9c4e0622ca7979f5c768c569819d48e26355001cb467'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'C030.docx').write_bytes(data)
          PY
      - name: Reproduce original target failure without the new layout integration
        run: |
          set -euo pipefail
          p=packages/renderers/word/src/wordDocx.ts
          git show "HEAD:$p" > "$p"
          trap 'git checkout-index -f -- packages/renderers/word/src/wordDocx.ts' EXIT
          if WORD_TABS_OUTPUT=output/word-tabs-before WORD_TABS_ORIGINAL="$RUNNER_TEMP/C030.docx" node packages/renderers/word/scripts/verify-explicit-tabs.mjs; then exit 1; fi
          python3 - <<'PY'
          import pathlib,json
          r=json.loads(pathlib.Path('output/word-tabs-before/report.json').read_text())
          assert r['completed'] and r['imageDecodeAwaited'] and r['screenshots']
          assert any(c['status']=='fail' and c['name']=='C030 DPR 1 zoom 1: suffix ends at the authored right stop' for c in r['checks'])
          PY
      - name: Verify fixed source, real original and existing integration
        run: |
          set -euo pipefail
          WORD_TABS_ORIGINAL="$RUNNER_TEMP/C030.docx" node packages/renderers/word/scripts/verify-explicit-tabs.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          node scripts/verify-container-compatibility.mjs
          for name in table-spec github-34 github-87 github-171 github-192 github-236; do node "packages/renderers/doc/scripts/verify-$name.mjs"; done
      - name: Push verified changes and bounded acceptance evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,os,shutil,hashlib,subprocess
          root=pathlib.Path('docs/regressions/evidence/word-explicit-tabs-20260924');root.mkdir(parents=True,exist_ok=True)
          report=json.loads(pathlib.Path('output/word-explicit-tabs/report.json').read_text())
          assert report['completed'] and report['passed']==27 and report['failed']==0 and report['screenshots'] and report['imageDecodeAwaited']
          for source,name in [('output/word-explicit-tabs/report.json','report.json'),('output/word-tabs-before/report.json','baseline.json'),('output/word-explicit-tabs/generated.png','generated.png'),('output/docx-engine-compatibility/report.json','engine.json'),('output/container-compatibility/report.json','containers.json')]:shutil.copyfile(source,root/name)
          assert json.loads((root/'engine.json').read_text())['passed']==11
          assert json.loads((root/'containers.json').read_text())['passed']==4
          (root/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'baseCommit':'9aa21c0ada457b88814e54ca9b0d29366c9c1e9b','original':'C030','checks':27,'wordUnitTests':33,'dpr':[1,2],'builds':['core','doc','word'],'install':'actual pnpm 11.0.9 frozen filtered workspace installation; patches preserved','fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}},indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## Word 显式制表位专项\n\n[显式制表位布局](word-explicit-tabs-20260924.md)：C030 原始 XML 的目标为框架段落，不是原生表格。右侧文字现按 425pt 制表位对齐；871 个正文字符及 5 图保留，27 项真实 renderer/原样/缩放检查通过。13 项新增单元测试覆盖边界，目录前导符与 RTL/竖排不使用此物理坐标近似。只结清对应显式制表错位，其他 Word 原稿与完整分页边界不变。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(root),str(p)],check=True)
          PY
          git rm -- .github/word-tab-review.b64 .github/workflows/word-tab-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): align explicit tab stops with authored paragraph geometry'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
