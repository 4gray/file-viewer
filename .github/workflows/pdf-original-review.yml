name: Original PDF acceptance
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
concurrency:
  group: pdf-original-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare hash-pinned temporary acceptance inputs
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,os,hashlib,concurrent.futures
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pdf-originals';root.mkdir()
          inputs=[('C020','30579280/x.pdf','d4fbb2af8f4635b7c573195ea7270ab825bb60f8828aa517198a0ecbe79030ab'),('C021','30730755/01.pages.1-7.pdf','a2f4535c6e092e984ab96641938b7d710d2f9dc151eea529eddd01f25c353cca'),('C023','30895725/default.pdf','9c4f76d09fadc48d0ee21137de4f42e5b4dc2706e9b78eed8e4adae0261235e4'),('C026','30920500/default.pdf','3e6749434d0fbb8ba5d646bf24abc1bdeba8319437e76883474a7399f0c34c0f'),('C028','30921630/j2cj-user-guide-zh.pdf','2f253d5a1064e5ca97bc70ce1e38caa84c649aa09b999cf1a1f1a055b33eeae4'),('C047','32178274/Microsoft.Word.pdf','b158fee6494e550b1df8367776700aaee16683a8d3abaf5bd53ee238b61d0dde')]
          def load(item):
            identity,suffix,expected=item
            with urllib.request.urlopen('https://github.com/user-attachments/files/'+suffix,timeout=90) as response: data=response.read(32*1024*1024+1)
            assert len(data)<=32*1024*1024 and hashlib.sha256(data).hexdigest()==expected,identity
            (root/(identity+'.pdf')).write_bytes(data)
            print(identity,len(data),expected)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(load,inputs))
          PY
      - name: Install and build actual runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdf-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const d of ['core','renderers/pdf']){
            const p=JSON.parse(fs.readFileSync(`packages/${d}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pdf-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/pdf-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          ln -s "$RUNNER_TEMP/pdf-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          ln -s "$RUNNER_TEMP/pdf-runtime/node_modules" "$GITHUB_WORKSPACE/packages/renderers/pdf/node_modules"
          cd "$GITHUB_WORKSPACE"
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/pdf-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/pdf-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/pdf run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify all original pages and real HTTP policies
        run: |
          set -euo pipefail
          PDF_CORPUS_DIR="$RUNNER_TEMP/pdf-originals" node packages/renderers/pdf/scripts/verify-original-pdfs.mjs
          node packages/renderers/pdf/scripts/verify-viewport-lifecycle.mjs
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check
      - name: Print bounded diagnostic report
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('output/pdf-original-review/report.json')
          if p.exists():
            r=json.loads(p.read_text());r.pop('documents',None);r.pop('requests',None);print(json.dumps(r,indent=2))
          PY
      - name: Push numerical acceptance evidence only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,os,shutil,hashlib
          src=pathlib.Path('output/pdf-original-review/report.json');r=json.loads(src.read_text())
          assert r['passed']==16 and len(r['documents'])==12
          assert sum(d['pageCount'] for d in r['documents'])==126
          dest=pathlib.Path('docs/regressions/evidence/pdf-original-20260923');dest.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(src,dest/'report.json')
          receipt={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'originals':6,'uniquePages':63,'pageChecks':126,'dpr':[1,2],'scope':'Original byte identities, page geometry/backing resolution, thumbnail native raster comparison, one content scroller, hidden dialog initial fit, controlled same-origin Referer and 403 policy. Not iOS/App WebView or desktop pixel equivalence.'}
          (dest/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/pdf-original-20260923
          git rm -- .github/workflows/pdf-original-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pdf): accept original page geometry and controlled HTTP loading'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
