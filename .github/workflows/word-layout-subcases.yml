name: Word original layout subcases
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/word-layout-subcases.b64, .github/workflows/word-layout-subcases.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Unpack bounded acceptance additions
        run: |
          python3 - <<'PY'
          import pathlib,lzma,base64,hashlib,json,subprocess
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(base64.b64decode(pathlib.Path('.github/word-layout-subcases.b64').read_text().strip(),validate=True),max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest()=='ec48ddb01dc489147ba3b08694c732b25a441abba57a10c249b3dc04c03d41ee'
          files=json.loads(raw);assert len(files)==2
          for name,text in files.items():
            p=pathlib.Path(name)
            assert not p.exists() and not p.is_absolute() and '..' not in p.parts and name.startswith(('packages/renderers/word/scripts/','docs/regressions/'))
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          subprocess.run(['git','add','--',*files],check=True)
          PY
      - name: Install and build owning packages
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/layout-tooling" --ignore-scripts --no-audit --no-fund --save-exact pnpm@11.0.9
          node "$RUNNER_TEMP/layout-tooling/node_modules/pnpm/bin/pnpm.cjs" --filter . --filter @file-viewer/renderer-word... --filter @file-viewer/pptx install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json patches/
          npm --prefix packages/core run build
          npm --prefix packages/renderers/doc run build
          npm --prefix packages/renderers/word run build
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare immutable originals outside the repository
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,os,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'layout-originals';root.mkdir()
          entries=[('C018',12073,'95d88af68bde958c0825c575731a2cf81c716b736f4f9c06bf15e427ab4bf4cb','30418339/default.docx'),('C031',38203,'19a5b398b8037bd2cc3bbab4a5d39c2b889873aa181091829a0fd7429f0a5418','31203862/_20260818.docx'),('C033',57195,'66eaea32fac0ee6cd8fc359fa01a7273263cb53b4f630cf92ba590f4c3bd73dc','31212430/OA.2025.10.30_0.71.docx')]
          for id,size,sha,url in entries:
            with urllib.request.urlopen('https://github.com/user-attachments/files/'+url,timeout=60) as response:data=response.read(1024*1024)
            assert len(data)==size and hashlib.sha256(data).hexdigest()==sha,id
            (root/(id+'.docx')).write_bytes(data)
          PY
      - name: Verify originals and existing Word integration
        run: |
          set -euo pipefail
          WORD_LAYOUT_CORPUS_DIR="$RUNNER_TEMP/layout-originals" node packages/renderers/word/scripts/verify-original-layout-subcases.mjs
          node scripts/verify-docx-engine-compatibility.mjs
          for name in table-spec github-34 github-87 github-171 github-192 github-236; do node "packages/renderers/doc/scripts/verify-$name.mjs"; done
      - name: Push numerical evidence and precise status updates
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib,json,shutil,hashlib,os,subprocess
          dest=pathlib.Path('docs/regressions/evidence/word-layout-subcases-20260924');dest.mkdir(parents=True,exist_ok=True)
          source=pathlib.Path('output/word-layout-subcases/report.json');report=json.loads(source.read_text())
          assert report['completed'] and report['passed']==15 and len(report['originals'])==6
          shutil.copyfile(source,dest/'report.json')
          engine=pathlib.Path('output/docx-engine-compatibility/report.json');assert json.loads(engine.read_text())['passed']==11;shutil.copyfile(engine,dest/'engine-regression.json')
          receipt={'run':os.environ['GITHUB_RUN_ID'],'checkedCommit':os.environ['GITHUB_SHA'],'checks':15,'originals':['C018','C031','C033'],'dpr':[1,2],'builds':['core','doc','word'],'install':'actual pnpm 11.0.9 frozen filtered install; declared patches retained','newProductFix':False,'fullCorpusAccepted':False,'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dest.iterdir() if p.is_file()}}
          (dest/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=pathlib.Path('docs/regressions/corpus-progress-20260922.md');s=p.read_text();s+='\n## Word 原样子项复核\n\n[列表、缩放及流程图](word-layout-subcases-20260924.md)：C018 的两处列表标记、C031 的单页88%缩放及往返缩放、C033 的横向表格文字和原始SVG流程图均通过实际renderer原样验收。15项检查在DPR 1/2下运行，正文字符、行/单元格完整。这是已有行为确认，不计为新增修复；不重复将这些已确认子项列为待处理。其余原稿的制表符、页眉图形、印章及完整跨页表格布局继续按W02范围核对。\n';p.write_text(s)
          subprocess.run(['git','add','--',str(dest),str(p)],check=True)
          PY
          git rm -- .github/word-layout-subcases.b64 .github/workflows/word-layout-subcases.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(word): close original list marker zoom and SVG diagram subcases'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
