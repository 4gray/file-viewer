name: Compatibility review

on:
  push:
    branches: [fix/compatibility-review-20260922]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/review-output"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/review-output/source.tar.gz"
      - name: Install isolated parser and browser test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/review-runtime"
          cd "$RUNNER_TEMP/review-runtime"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact @file-viewer/core@3.1.2 @file-viewer/renderer-word@3.1.2 @file-viewer/renderer-pdf@3.1.2 @file-viewer/renderer-presentation@3.1.2 @file-viewer/vite-plugin@3.1.2 typescript@6.0.3 vitest@4.1.8 jsdom@27.4.0 playwright@1.61.1 esbuild@0.25.12
          tar -czf "$RUNNER_TEMP/review-output/runtime.tar.gz" .
      - name: Run focused regression gate when present
        run: |
          if test -f scripts/verify-compatibility-review.mjs; then
            NODE_PATH="$RUNNER_TEMP/review-runtime/node_modules" node scripts/verify-compatibility-review.mjs
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: compatibility-review-inputs
          path: ${{ runner.temp }}/review-output/
          retention-days: 3
          compression-level: 0
