name: Compatibility review

on:
  push:
    branches: [fix/compatibility-review-20260922]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: compatibility-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply hash-verified review patch
        run: |
          python3 - <<'PY'
          import pathlib, base64, lzma, hashlib, subprocess, json
          root = pathlib.Path('.github/compatibility-review')
          encoded = ''.join((root / f'payload-{i}.txt').read_text() for i in range(5))
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=2 * 1024 * 1024)
          assert decoder.eof and not decoder.unused_data, 'invalid patch framing'
          assert hashlib.sha256(patch).hexdigest() == '2d790afa59ac0b22ffed1ebb9884318d3c9de69c04c4044b5424acf9097e6e11', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          paths = json.loads((root / 'paths.json').read_text())
          assert len(paths) == 27 and all(not p.startswith('.github/') and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
          assert all(pathlib.Path(p).is_file() for p in paths)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Install isolated real package dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/review-runtime" output/compatibility-review
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const dependencies = {};
          for (const name of ['core','renderers/doc','renderers/word','renderers/pdf','renderers/text','renderers/pptx']) {
            const p = JSON.parse(fs.readFileSync(`packages/${name}/package.json`, 'utf8'));
            for (const [id, version] of Object.entries({...p.dependencies,...p.devDependencies})) {
              dependencies[id] = version.startsWith('workspace:') ? version.slice(10) : version.replace(/^[~^]/, '');
            }
          }
          Object.assign(dependencies, {playwright:'1.63.0', 'billboard.js':'3.18.0', 'd3-format':'3.1.2', esbuild:'0.28.2'});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'review-runtime/package.json'), JSON.stringify({private:true,type:'module',dependencies},null,2));
          JS
          cd "$RUNNER_TEMP/review-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          ln -s "$RUNNER_TEMP/review-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          ln -s "$RUNNER_TEMP/review-runtime/node_modules" "$GITHUB_WORKSPACE/packages/renderers/pdf/node_modules"
          cp package-lock.json "$GITHUB_WORKSPACE/output/compatibility-review/verification-package-lock.json"
      - name: Build and type-check owning packages
        run: |
          set -euo pipefail
          npm --prefix packages/core run build 2>&1 | tee output/compatibility-review/build-core.log
          rm -rf "$RUNNER_TEMP/review-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/review-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/doc run build 2>&1 | tee output/compatibility-review/build-doc.log
          rm -rf "$RUNNER_TEMP/review-runtime/node_modules/@file-viewer/doc"
          ln -s "$GITHUB_WORKSPACE/packages/renderers/doc" "$RUNNER_TEMP/review-runtime/node_modules/@file-viewer/doc"
          for package in pptx word pdf text; do
            npm --prefix "packages/renderers/$package" run build 2>&1 | tee "output/compatibility-review/build-$package.log"
          done
      - name: Existing parser regression gates
        run: |
          set -euo pipefail
          node packages/renderers/doc/scripts/verify-table-spec.mjs 2>&1 | tee output/compatibility-review/doc-table-spec.log
          for number in 34 87 171 192 236; do
            node "packages/renderers/doc/scripts/verify-github-$number.mjs" 2>&1 | tee "output/compatibility-review/doc-$number.log"
          done
          node packages/renderers/pptx/scripts/verify-github-176.mjs 2>&1 | tee output/compatibility-review/pptx-176.log
          node packages/renderers/pptx/scripts/verify-github-268.mjs 2>&1 | tee output/compatibility-review/pptx-268.log
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check 2>&1 | tee output/compatibility-review/pdf-runtime.log
      - name: Install Chromium
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify generated fixtures and browser behavior
        run: |
          set -euo pipefail
          node scripts/verify-compatibility-review.mjs 2>&1 | tee output/compatibility-review/checks.log
      - name: Commit only verified changes to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import pathlib, json, hashlib, shutil, subprocess, os
          paths = json.loads(pathlib.Path('.github/compatibility-review/paths.json').read_text())
          evidence = pathlib.Path('docs/regressions/evidence/compatibility-20260922')
          evidence.mkdir(parents=True, exist_ok=True)
          for name in ['pptx-table.png','pptx-charts.png','doc-table.png','docx-pagination.png','markdown-anchors.png','report.json','chart-geometry.json','docx-pagination.json']:
            target = evidence / name
            shutil.copyfile(pathlib.Path('output/compatibility-review') / name, target)
            paths.append(str(target))
          report = json.loads((evidence / 'report.json').read_text())
          receipt = {'workflow_run': os.environ['GITHUB_RUN_ID'], 'source_base': '533b60da7bdcd7c42d225441d54406dafc75e33c', 'scope': 'six owning package builds, existing parser gates and generated-fixture Chromium checks; not full workspace release validation', 'sha256': {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          receipt_path = evidence / 'verification.json'
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          paths.append(str(receipt_path))
          subprocess.run(['git','add','--'] + paths, check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          staged = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged == set(paths), 'unexpected staged path'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(renderers): correct document layout and scoped navigation'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
          head_sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head_sha" -f state=success -f context='Compatibility regression checks' -f description='Owning package builds and 36 focused checks passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '%s\n' "$head_sha" > output/compatibility-review/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: compatibility-review-verification
          path: output/compatibility-review/
          retention-days: 7
          if-no-files-found: warn
