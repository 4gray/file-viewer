name: Compatibility review
on:
  push:
    branches: [fix/compatibility-review-20260922]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare renderer verification dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/review-runtime" "$RUNNER_TEMP/review-output"
          cd "$RUNNER_TEMP/review-runtime"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact @file-viewer/renderer-text@3.1.2 @file-viewer/capability-pptx-charts@3.1.2
          tar -czf "$RUNNER_TEMP/review-output/text-chart-runtime.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: text-chart-runtime
          path: ${{ runner.temp }}/review-output/
          retention-days: 3
          compression-level: 0
