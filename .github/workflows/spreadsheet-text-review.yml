name: Legacy spreadsheet text verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply bounded verified patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          data=base64.b64decode(pathlib.Path('.github/spreadsheet-text-review.b64').read_text().strip(),validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(data,max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest()=='8f7d1baa4173bd14b174344548fe4e8d6fc80018ea404576e97d935bdd6d1ca4'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==7 and all(not p.startswith('.github/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Install actual parser and browser dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/text-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const dir of ['core','renderers/spreadsheet']){
            const p=JSON.parse(fs.readFileSync(`packages/${dir}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/text-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/text-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/text-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Build source packages and run existing regressions
        run: |
          set -euo pipefail
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/text-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/text-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/spreadsheet run build
          node packages/renderers/spreadsheet/scripts/verify-github-175.mjs
          node packages/renderers/spreadsheet/scripts/verify-github-234.mjs
      - name: Run actual browser, parser and Worker checks
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node packages/renderers/spreadsheet/scripts/verify-text-containers.mjs
      - name: Push tested code and evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compatibility-review-20260922
          python3 - <<'PY'
          import os,pathlib,json,shutil
          src=pathlib.Path('output/spreadsheet-text-containers');dst=pathlib.Path('docs/regressions/evidence/spreadsheet-text-20260922')
          dst.mkdir(parents=True,exist_ok=True)
          for n in ['report.json','unicode-cell.png']:shutil.copyfile(src/n,dst/n)
          assert json.loads((dst/'report.json').read_text())['passed']==18
          (dst/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'checks':18,'scope':'Core and Spreadsheet builds; actual parser, renderer search and classic Worker; existing dimension and rich-text gates; not full workbook fidelity'},indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/spreadsheet-text-20260922
          git rm -- .github/spreadsheet-text-review.b64 .github/workflows/spreadsheet-text-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(spreadsheet): decode text-backed legacy Excel containers'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
