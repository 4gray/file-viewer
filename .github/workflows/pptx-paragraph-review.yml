name: PPTX paragraph compatibility
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
concurrency:
  group: pptx-paragraph-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Prepare actual dependencies and hash-pinned temporary input
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pptx-runtime" "$RUNNER_TEMP/pptx-originals"
          python3 - <<'PY'
          import urllib.request,pathlib,os,hashlib
          with urllib.request.urlopen('https://github.com/user-attachments/files/32271447/xxx.2_.pptx',timeout=90) as response:data=response.read(16*1024*1024+1)
          assert len(data)<=16*1024*1024 and hashlib.sha256(data).hexdigest()=='5a178b6c5dc63976ae4a133eaff14927ac40320609073b6e836ee7b814b1e685'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'pptx-originals/C050.pptx').write_bytes(data)
          PY
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const d of ['core','renderers/pptx']){
            const p=JSON.parse(fs.readFileSync(`packages/${d}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pptx-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/pptx-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/pptx-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          npm --prefix packages/core run build
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify original implementation fails at the target assertion
        run: |
          set -euo pipefail
          if node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs > "$RUNNER_TEMP/baseline.log" 2>&1;then cat "$RUNNER_TEMP/baseline.log";exit 1;fi
          cat "$RUNNER_TEMP/baseline.log"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('output/pptx-paragraph-numbering/report.json','utf8'));
          if(r.checks[0]?.status!=='fail'||!r.checks[0]?.name.startsWith('Authored Roman'))throw Error('Unexpected baseline failure');
          JS
      - name: Apply source correction and run owning regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,lzma,base64,hashlib,subprocess
          raw=base64.b64decode(pathlib.Path('.github/pptx-paragraph-review.b64').read_text(),validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(raw,max_length=128*1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest()=='a83250bbc428fdce42a0d163bc7749f3d4dbd6ab4790f9103a91ba2c7c417ff2'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths)=={'packages/renderers/pptx/src/chart.ts','packages/renderers/pptx/src/engine/support/vendor.js'}
          PY
          npm --prefix packages/renderers/pptx run build
          node packages/renderers/pptx/scripts/verify-github-176.mjs
          node packages/renderers/pptx/scripts/verify-github-268.mjs
          PPTX_PARAGRAPH_CORPUS_DIR="$RUNNER_TEMP/pptx-originals" node packages/renderers/pptx/scripts/verify-paragraph-numbering.mjs
      - name: Push verified source and neutral evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,os,shutil
          src=pathlib.Path('output/pptx-paragraph-numbering');dest=pathlib.Path('docs/regressions/evidence/pptx-paragraph-20260923');dest.mkdir(parents=True,exist_ok=True)
          for name in ['report.json','geometry.json','generated.png']:shutil.copyfile(src/name,dest/name)
          r=json.loads((dest/'report.json').read_text());assert r['passed']==12 and len(r['originals'])==1
          (dest/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'baselineTargetFailure':True,'checks':12,'scope':'Core/PPTX builds, existing connector/chart regressions, generated package and C050 raw-byte Roman labels/spacing. Not complete slide fidelity.','sha256':{name:hashlib.sha256((dest/name).read_bytes()).hexdigest() for name in ['report.json','geometry.json','generated.png']}},indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/pptx-paragraph-20260923
          git rm -- .github/pptx-paragraph-review.b64 .github/workflows/pptx-paragraph-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pptx): preserve numbering schemes and paragraph spacing inheritance'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
