name: PDF viewport lifecycle verification
on:
  push:
    branches: [fix/compatibility-review-20260922]
permissions:
  contents: write
concurrency:
  group: pdf-viewport-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'flyfish-dev/file-viewer' && github.ref == 'refs/heads/fix/compatibility-review-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install isolated real package dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-runtime"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dependencies={};
          for(const d of ['core','renderers/pdf']){
            const p=JSON.parse(fs.readFileSync(`packages/${d}/package.json`,'utf8'));
            for(const [id,v] of Object.entries({...p.dependencies,...p.devDependencies}))dependencies[id]=v.startsWith('workspace:')?v.slice(10):v.replace(/^[~^]/,'');
          }
          Object.assign(dependencies,{playwright:'1.63.0',esbuild:'0.28.2'});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/pdf-runtime/package.json`,JSON.stringify({private:true,type:'module',dependencies}));
          JS
          cd "$RUNNER_TEMP/pdf-runtime"
          npm install --ignore-scripts --no-audit --no-fund
          patch --batch --forward -p1 -d node_modules/pdfjs-dist < "$GITHUB_WORKSPACE/patches/pdfjs-dist@5.4.624.patch"
          ln -s "$RUNNER_TEMP/pdf-runtime/node_modules" "$GITHUB_WORKSPACE/node_modules"
          ln -s "$RUNNER_TEMP/pdf-runtime/node_modules" "$GITHUB_WORKSPACE/packages/renderers/pdf/node_modules"
      - name: Build original source and confirm the regression fails
        run: |
          set -euo pipefail
          npm --prefix packages/core run build
          rm -rf "$RUNNER_TEMP/pdf-runtime/node_modules/@file-viewer/core"
          ln -s "$GITHUB_WORKSPACE/packages/core" "$RUNNER_TEMP/pdf-runtime/node_modules/@file-viewer/core"
          npm --prefix packages/renderers/pdf run build
          node node_modules/playwright/cli.js install --with-deps chromium
          if node packages/renderers/pdf/scripts/verify-viewport-lifecycle.mjs > "$RUNNER_TEMP/before.log" 2>&1; then
            cat "$RUNNER_TEMP/before.log"; exit 1
          fi
          cat "$RUNNER_TEMP/before.log"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('output/pdf-viewport-lifecycle/report.json','utf8'));
          if(r.checks[0]?.status!=='fail'||!r.checks[0].error.includes('true !== false'))throw Error('Baseline failed outside the target assertion');
          JS
      - name: Apply reviewed fix and verify real Worker behavior
        run: |
          set -euo pipefail
          sha256sum .github/pdf-viewport.patch
          echo '2d02447c475f74dca3a748317e9da3fdd1028334602112f31b4e2459fe60417d  .github/pdf-viewport.patch' | sha256sum --check
          git apply --check .github/pdf-viewport.patch
          git apply --index .github/pdf-viewport.patch
          npm --prefix packages/renderers/pdf run build
          node packages/renderers/pdf/scripts/verify-viewport-lifecycle.mjs
          node packages/renderers/pdf/scripts/stage-pdfjs-runtime.mjs --check
      - name: Commit verified source and generated evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,shutil,os
          r=pathlib.Path('docs/regressions/evidence/pdf-viewport-20260923');r.mkdir(parents=True,exist_ok=True)
          for name in ['report.json','revealed.json','revealed.png']:shutil.copyfile(pathlib.Path('output/pdf-viewport-lifecycle')/name,r/name)
          assert json.loads((r/'report.json').read_text())['passed']==9
          (r/'verification.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'scope':'Core/PDF builds; baseline assertion fails; nine real browser/Worker lifecycle checks pass. Original corpus not included in this gate.'},indent=2)+'\n')
          PY
          git add -- docs/regressions/evidence/pdf-viewport-20260923
          git rm -- .github/pdf-viewport.patch .github/workflows/pdf-viewport-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pdf): defer initial fitting until the document viewport is measurable'
          git push origin HEAD:refs/heads/fix/compatibility-review-20260922
